name: Build proxies for multiple ports

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # позволяет запускать вручную
    inputs:
      ports:
        description: 'Порты через запятую (например: 8080,8888,8989,9999)'
        required: false
        default: '8080,8888,8989,9999'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate proxy files for different ports
        run: |
          PORTS=${{\ github.event.inputs.ports || '8080,8888,8989,9999' }}
          IFS=',' read -ra PORT_ARRAY <<< "$PORTS"
          
          for PORT in "${PORT_ARRAY[@]}"; do
            echo "Generating for port $PORT"
            sed "s/{{PORT}}/$PORT/g" server_template.py > "server_port_${PORT}.py"
          done
          
          # Создаём README с инструкциями
          cat > PROXIES.md << EOF
          # Доступные прокси
          
          | Порт | Команда для запуска |
          |------|---------------------|
          EOF
          
          for PORT in "${PORT_ARRAY[@]}"; do
            echo "| $PORT | \`python -c \"\$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/server_port_${PORT}.py)\"\` |" >> PROXIES.md
          done
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxy-scripts
          path: server_port_*.py
      
      - name: Commit and push generated files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add server_port_*.py PROXIES.md
          git commit -m "Auto-generate proxies for ports" || exit 0
          git push
